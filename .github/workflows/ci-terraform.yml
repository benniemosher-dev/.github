---
on:
  workflow_call:
    inputs:
      enable-cloudflare-tfvars:
        default: false
        required: false
        type: boolean
      enable-cost:
        default: true
        required: false
        type: boolean
      enable-pre-commit:
        default: true
        required: false
        type: boolean
      enable-security:
        default: true
        required: false
        type: boolean
      enable-test:
        default: true
        required: false
        type: boolean
      test-directories:
        default: '[]'
        description: >-
          JSON list of extra directories to run `terraform test` in, for a
          submodule whose tests need a provider mock the root can't have.
        required: false
        type: string
      terraform-versions:
        default: '["1.16.5"]'
        description: >-
          JSON list of Terraform versions for the test job. For a module, use
          the oldest version its required_version allows and the newest.
        required: false
        type: string
    secrets:
      CLOUDFLARE_CONFIG:
        required: false
      INFRACOST_API_KEY:
        required: true

jobs:
  pre-commit:
    name: Pre-Commit
    uses: "./.github/workflows/pre-commit-terraform.yml"
    if: ${{ inputs.enable-pre-commit == true }}

  security:
    name: Security
    uses: "./.github/workflows/sec-terraform.yml"
    if: ${{ inputs.enable-security == true }}

  test:
    name: Test
    uses: "./.github/workflows/test-terraform.yml"
    if: ${{ inputs.enable-test == true }}
    with:
      terraform-versions: ${{ inputs.terraform-versions }}
      test-directories: ${{ inputs.test-directories }}

  cost:
    name: Cost
    uses: "./.github/workflows/cost-terraform.yml"
    if: ${{ inputs.enable-cost == true }}
    secrets:
      CLOUDFLARE_CONFIG: ${{ secrets.CLOUDFLARE_CONFIG }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    with:
      enable-cloudflare-tfvars: ${{ inputs.enable-cloudflare-tfvars }}
